name: Reusable Cortex Security Scan

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      scan_directory:
        required: false
        type: string
        default: "."
      environment_name:
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    
    env:
      CORTEX_API_URL: https://api-pcscortexcloud.xdr.us.paloaltonetworks.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Image
        uses: actions/download-artifact@v4
        with:
          name: nginx-image

      - name: Load and Verify File Presence
        run: |
          docker load < nginx-image.tar
          # Verify that the COPY command in your Dockerfile successfully placed the file
          echo "Verifying /etc/wildfire-elf exists in the image..."
          docker run --rm --entrypoint /bin/sh ${{ inputs.image_name }} -c "ls -l /etc/wildfire-elf" || echo "ERROR: File not found"

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq libhyperscan5

      - name: Download Cortex CLI
        env:
          CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
          CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
        run: |
          RESPONSE=$(curl -s -f \
            -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
            -H "Authorization: ${CORTEX_API_KEY}" \
            "${{ env.CORTEX_API_URL }}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64")
          
          URL=$(echo "$RESPONSE" | jq -r '.signed_url // empty')
          curl -s -L -o ./cortexcli "$URL"
          chmod +x ./cortexcli

      - name: IaC (Code) Scan
        env:
          CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
          CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
        run: |
          ./cortexcli \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            --api-base-url "${{ env.CORTEX_API_URL }}" \
            code scan \
            --directory "${{ inputs.scan_directory }}" \
            --repo-id "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --create-repo-if-missing \
            --timeout 300 || echo "IaC risks identified."

      - name: Image Scan and Malware Detection
        env:
          CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
          CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
        run: |
          # Creating logs directory before the scan to prevent artifact upload errors
          mkdir -p .cortexcli/logs
          
          # Explicitly include 'malware' to detect wildfire-elf
          # Ensure --log-path matches the path used in the 'Upload Debug Logs' step
          ./cortexcli \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            --api-base-url "${{ env.CORTEX_API_URL }}" \
            image scan "${{ inputs.image_name }}" \
            --scanners "vulnerability,malware,secret" \
            --repo-id "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --create-repo-if-missing \
            --log-path ".cortexcli/logs/image-scan.log" \
            --timeout 300 || echo "Security risks found."

      - name: Upload Debug Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-debug-logs
          # This path must match the --log-path provided in the scan step
          path: .cortexcli/logs/

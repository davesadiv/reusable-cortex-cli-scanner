name: Reusable Cortex Security Scan

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      scan_directory:
        required: false
        type: string
        default: "."
      environment_name:
        required: false
        type: string
        default: "Cortex"

jobs:
  scan:
    runs-on: ubuntu-latest
    # Updated to point to your 'Cortex' environment
    environment: ${{ inputs.environment_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Image
        uses: actions/download-artifact@v4
        with:
          name: nginx-image

      - name: Load and Verify File Presence
        run: |
          docker load < nginx-image.tar
          # Verify wildfire-elf exists in the image layers
          echo "Verifying /etc/wildfire-elf presence..."
          docker run --rm --entrypoint /bin/sh ${{ inputs.image_name }} -c "ls -l /etc/wildfire-elf"

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq libhyperscan5

      - name: Download Cortex CLI
        env:
          CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
          CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
          CORTEX_API_URL: ${{ secrets.CORTEX_API_URL }}
        run: |
          # Retrieve the signed download link for the CLI
          RESPONSE=$(curl -s -f \
            -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
            -H "Authorization: ${CORTEX_API_KEY}" \
            "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64")
          URL=$(echo "$RESPONSE" | jq -r '.signed_url // empty')
          curl -s -L -o ./cortexcli "$URL"
          chmod +x ./cortexcli

      - name: IaC (Code) Scan
        env:
          CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
          CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
          CORTEX_API_URL: ${{ secrets.CORTEX_API_URL }}
        run: |
          # Performs IaC analysis and pushes results to the cloud
          ./cortexcli \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            --api-base-url "${CORTEX_API_URL}" \
            code scan \
            --directory "${{ inputs.scan_directory }}" \
            --repo-id "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --create-repo-if-missing \
            --timeout 300 || echo "IaC risks identified."

      - name: Image Scan and Malware Detection
        env:
          CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
          CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
          CORTEX_API_URL: ${{ secrets.CORTEX_API_URL }}
        run: |
          # Use absolute workspace path to fix the "No files found" artifact error
          mkdir -p ${{ github.workspace }}/cortex_logs
          
          # Explicitly includes 'malware' scanner to detect wildfire-elf
          ./cortexcli \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            --api-base-url "${CORTEX_API_URL}" \
            image scan "${{ inputs.image_name }}" \
            --scanners "vulnerability,malware,secret" \
            --repo-id "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --create-repo-if-missing \
            --log-path "${{ github.workspace }}/cortex_logs/image-scan.log" \
            --timeout 300 || echo "Security risks identified"

      - name: Upload Debug Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:

name: Reusable Cortex Security Scan

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      scan_directory:
        required: false
        type: string
        default: "."
      environment_name:
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    
    env:
      CORTEX_API_URL: https://api-pcscortexcloud.xdr.us.paloaltonetworks.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Image
        uses: actions/download-artifact@v4
        with:
          name: nginx-image

      - name: Load Image into Docker
        run: |
          # Load the image built in the previous job into the local daemon
          docker load < nginx-image.tar
          docker images

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq libhyperscan5

      - name: Download Cortex CLI
        env:
          CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
          CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
        run: |
          # Retrieve the signed download link for the latest CLI binary
          RESPONSE=$(curl -s -f \
            -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
            -H "Authorization: ${CORTEX_API_KEY}" \
            "${{ env.CORTEX_API_URL }}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64")
          
          URL=$(echo "$RESPONSE" | jq -r '.signed_url // empty')
          curl -s -L -o ./cortexcli "$URL"
          chmod +x ./cortexcli

      - name: IaC (Code) Scan
        env:
          CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
          CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
        run: |
          # Use 'code scan' for IaC misconfiguration analysis
          # --api-base-url, --api-key-id, and --api-key are required for cloud upload
          ./cortexcli \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            --api-base-url "${{ env.CORTEX_API_URL }}" \
            code scan \
            --directory "${{ inputs.scan_directory }}" \
            --repo-id "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --create-repo-if-missing \
            --timeout 300 || echo "IaC scan identified security risks."

      - name: Image Scan and Upload
        env:
          CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
          CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
        run: |
          # Confirm local image presence before container analysis
          docker images | grep "nginx"
          
          # Perform image scanning and push results to the tenant
          # --create-repo-if-missing ensures results are mapped to your catalog
          ./cortexcli \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            --api-base-url "${{ env.CORTEX_API_URL }}" \
            image scan "${{ inputs.image_name }}" \
            --scanners "vulnerability,malware,secret" \
            --repo-id "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --create-repo-if-missing \
            --timeout 300 || echo "Image scan identified security risks."

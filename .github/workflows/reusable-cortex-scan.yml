name: Reusable Cortex Security Scan

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      scan_directory:
        required: false
        type: string
        default: "."
      environment_name:
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    
    env:
      CORTEX_API_URL: https://api-pcscortexcloud.xdr.us.paloaltonetworks.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Image
        uses: actions/download-artifact@v4
        with:
          name: nginx-image

      - name: Load Image into Docker
        run: |
          docker load < nginx-image.tar
          docker images

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq libhyperscan5

      - name: Download Cortex CLI
        env:
          CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
          CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
        run: |
          RESPONSE=$(curl -s -f -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" -H "Authorization: ${CORTEX_API_KEY}" "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64")
          URL=$(echo "$RESPONSE" | jq -r '.signed_url // empty')
          curl -s -L -o ./cortexcli "$URL"
          chmod +x ./cortexcli

      - name: IaC (Code) Scan
        env:
          CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
          CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
        # Consolidated to one line with --print-results
        run: ./cortexcli --api-key "${CORTEX_API_KEY}" --api-key-id "${CORTEX_API_KEY_ID}" --api-base-url "${CORTEX_API_URL}" --soft-fail code scan --directory "${{ inputs.scan_directory }}" --repo-id "${{ github.repository }}" --print-results

      - name: Image Scan
        env:
          CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
          CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
        # --soft-fail must be a global flag before the 'image' command
        run: ./cortexcli --api-key "${CORTEX_API_KEY}" --api-key-id "${CORTEX_API_KEY_ID}" --api-base-url "${CORTEX_API_URL}" --soft-fail image scan "${{ inputs.image_name }}" --scanners "vulnerability,malware,secret" --print-results

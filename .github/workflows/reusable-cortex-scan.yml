name: Reusable Cortex Security Scan

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      scan_directory:
        required: false
        type: string
        default: "."
      environment_name:
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    
    env:
      CORTEX_API_URL: https://api-pcscortexcloud.xdr.us.paloaltonetworks.com

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built Image
        uses: actions/download-artifact@v4
        with:
          name: nginx-image

      - name: Load and Verify File Presence
        run: |
          docker load < nginx-image.tar
          # Confirmed presence in your logs: -rw-r--r-- 1 root root 8608 /etc/wildfire-elf
          echo "Verifying file presence in image..."
          docker run --rm --entrypoint /bin/sh ${{ inputs.image_name }} -c "ls -l /etc/wildfire-elf"

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq libhyperscan5

      - name: Download Cortex CLI
        env:
          CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
          CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
        run: |
          RESPONSE=$(curl -s -f \
            -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
            -H "Authorization: ${CORTEX_API_KEY}" \
            "${{ env.CORTEX_API_URL }}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64")
          URL=$(echo "$RESPONSE" | jq -r '.signed_url // empty')
          curl -s -L -o ./cortexcli "$URL"
          chmod +x ./cortexcli

      - name: Image Scan and Malware Detection
        env:
          CORTEX_API_KEY: ${{ secrets.CORTEX_API_KEY }}
          CORTEX_API_KEY_ID: ${{ secrets.CORTEX_API_KEY_ID }}
        run: |
          # Create logs directory explicitly in the workspace
          mkdir -p ${{ github.workspace }}/logs
          
          # Force detailed scanning with malware engine enabled
          ./cortexcli \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            --api-base-url "${{ env.CORTEX_API_URL }}" \
            image scan "${{ inputs.image_name }}" \
            --scanners "vulnerability,malware,secret" \
            --repo-id "${{ github.repository }}" \
            --create-repo-if-missing \
            --log-path "${{ github.workspace }}/logs/image-scan.log" \
            --timeout 300 || echo "Security risks identified"

      - name: Upload Debug Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-debug-logs
          # Path must be absolute and match the --log-path used above
          path: ${{ github.workspace }}/logs/
